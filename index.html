<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trợ lý AI của tôi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            rgba(10, 15, 35, 0.9),
            rgba(35, 10, 70, 0.85)
        ),
        url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}

.app {
    width: 100%;
    max-width: 1000px;

    background: rgba(255,255,255,0.12);

    backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.2);

    border-radius: 25px;

    padding: 35px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5);
}

h1 {
    text-align: center;
    margin-top: 0;
    font-size: 38px;
}

.subtitle {
    text-align: center;
    opacity: 0.8;
}

#status {
    margin: 25px 0;

    padding: 18px;

    border-radius: 15px;

    background: rgba(0,0,0,0.3);

    text-align: center;

    font-size: 20px;
}

.mic-container {
    text-align: center;
}

.mic {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    border: none;

    font-size: 40px;

    cursor: pointer;

    margin: 15px;

    background: white;

    transition: 0.3s;
}

.mic:hover {
    transform: scale(1.1);
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 15px;

    margin-top: 25px;
}

.app-button {
    border: none;

    border-radius: 15px;

    padding: 20px;

    font-size: 17px;

    cursor: pointer;

    background: rgba(255,255,255,0.15);

    color: white;

    transition: 0.25s;
}

.app-button:hover {
    transform: translateY(-5px);

    background: rgba(255,255,255,0.28);
}

.footer {
    text-align: center;

    margin-top: 25px;

    opacity: 0.6;
}

</style>

</head>

<body>

<div class="app">

<h1>🤖 Trợ lý giọng nói AI</h1>

<p class="subtitle">
Nói tên ứng dụng hoặc bấm nút để mở
</p>

<div id="status">
🎤 Hệ thống đã sẵn sàng
</div>

<div class="mic-container">

<button class="mic" onclick="listen()">
🎤
</button>

</div>

<div class="grid">

<button class="app-button"
onclick="openWebsite('messenger')">
💬 Messenger
</button>

<button class="app-button"
onclick="openWebsite('facebook')">
📘 Facebook
</button>

<button class="app-button"
onclick="openWebsite('tiktok')">
🎵 TikTok
</button>

<button class="app-button"
onclick="openWebsite('maps')">
🗺️ Google Maps
</button>

<button class="app-button"
onclick="openWebsite('hazmob')">
🎮 Hazmob FPS
</button>

<button class="app-button"
onclick="openWebsite('piano')">
🎹 Virtual Piano
</button>

<button class="app-button"
onclick="openWebsite('chatgpt')">
🤖 ChatGPT
</button>

<button class="app-button"
onclick="openWebsite('gemini')">
✨ Gemini AI
</button>

<button class="app-button"
onclick="openWebsite('youtube')">
▶️ YouTube
</button>

</div>

<p class="footer">
Trợ lý giọng nói • Tiếng Việt 🇻🇳
</p>

</div>

<script>

const status =
document.getElementById("status");


function speak(text) {

    status.innerHTML =
    "🤖 " + text;

    const speech =
    new SpeechSynthesisUtterance(text);

    speech.lang = "vi-VN";

    speech.rate = 1;

    window.speechSynthesis.cancel();

    window.speechSynthesis.speak(speech);

}


function openWebsite(site) {

    let url = "";

    let name = "";


    if (site === "messenger") {

        url =
        "https://www.messenger.com/";

        name =
        "Messenger";

    }


    else if (site === "facebook") {

        url =
        "https://www.facebook.com/";

        name =
        "Facebook";

    }


    else if (site === "tiktok") {

        url =
        "https://www.tiktok.com/";

        name =
        "TikTok";

    }


    else if (site === "maps") {

        url =
        "https://www.google.com/maps";

        name =
        "Google Maps";

    }


    else if (site === "hazmob") {

        url =
        "https://www.crazygames.com/game/hazmob-fps";

        name =
        "Hazmob FPS";

    }


    else if (site === "piano") {

        url =
        "https://virtualpiano.net/";

        name =
        "Virtual Piano";

    }


    else if (site === "chatgpt") {

        url =
        "https://chatgpt.com/";

        name =
        "ChatGPT";

    }


    else if (site === "gemini") {

        url =
        "https://gemini.google.com/";

        name =
        "Gemini AI";

    }


    else if (site === "youtube") {

        url =
        "https://www.youtube.com/";

        name =
        "YouTube";

    }


    speak(
        "Đang mở " + name
    );


    setTimeout(function() {

        window.open(
            url,
            "_blank"
        );

    }, 500);

}



function listen() {


    const SpeechRecognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        speak(
            "Trình duyệt của bạn không hỗ trợ nhận diện giọng nói"
        );

        return;

    }


    const recognition =
    new SpeechRecognition();


    recognition.lang =
    "vi-VN";


    recognition.start();


    status.innerHTML =
    "🎤 Đang nghe bạn nói...";


    recognition.onresult =
    function(event) {


        const command =

        event.results[0][0]
        .transcript
        .toLowerCase();


        status.innerHTML =

        "👤 Bạn nói: " +
        command;


        if (
            command.includes("messenger")
        ) {

            openWebsite(
                "messenger"
            );

        }


        else if (
            command.includes("facebook")
        ) {

            openWebsite(
                "facebook"
            );

        }


        else if (

            command.includes("tiktok")

            ||

            command.includes("tik tok")

        ) {

            openWebsite(
                "tiktok"
            );

        }


        else if (

            command.includes("google maps")

            ||

            command.includes("bản đồ")

        ) {

            openWebsite(
                "maps"
            );

        }


        else if (

            command.includes("hazmob")

            ||

            command.includes("fps")

        ) {

            openWebsite(
                "hazmob"
            );

        }


        else if (

            command.includes("piano")

            ||

            command.includes("đàn")

        ) {

            openWebsite(
                "piano"
            );

        }


        else if (

            command.includes("chat gpt")

            ||

            command.includes("chatgpt")

        ) {

            openWebsite(
                "chatgpt"
            );

        }


        else if (

            command.includes("gemini")

        ) {

            openWebsite(
                "gemini"
            );

        }


        else if (

            command.includes("youtube")

        ) {

            openWebsite(
                "youtube"
            );

        }


        else {

            speak(
                "Tôi chưa hiểu lệnh này"
            );

        }

    };


    recognition.onerror =
    function() {

        speak(
            "Có lỗi với microphone"
        );

    };

}


speak(
    "Xin chào. Trợ lý giọng nói tiếng Việt đã sẵn sàng"
);

</script>

</body>
</html>

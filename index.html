<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trợ lý giọng nói</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    background: #f2f2f2;
}

h1 {
    font-size: 32px;
}

#status {
    background: white;
    padding: 20px;
    margin: 20px auto;
    border-radius: 12px;
    max-width: 600px;
    font-size: 20px;
}

button {
    padding: 15px 25px;
    margin: 8px;
    font-size: 18px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
}
</style>

</head>

<body>

<h1>🤖 Trợ lý giọng nói</h1>

<div id="status">
    Hãy bấm microphone và nói lệnh
</div>

<button onclick="listen()">🎤 Nói lệnh</button>

<button onclick="openWebsite('messenger')">💬 Messenger</button>
<button onclick="openWebsite('facebook')">📘 Facebook</button>
<button onclick="openWebsite('tiktok')">🎵 TikTok</button>
<button onclick="openWebsite('maps')">🗺️ Google Maps</button>
<button onclick="openWebsite('hazmob')">🎮 Hazmob FPS</button>

<script>

const status = document.getElementById("status");

function speak(text) {
    status.innerHTML = "🤖 " + text;

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "vi-VN";

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function openWebsite(site) {

    let url = "";
    let name = "";

    if (site === "messenger") {
        url = "https://www.messenger.com/";
        name = "Messenger";
    }

    else if (site === "facebook") {
        url = "https://www.facebook.com/";
        name = "Facebook";
    }

    else if (site === "tiktok") {
        url = "https://www.tiktok.com/";
        name = "TikTok";
    }

    else if (site === "maps") {
        url = "https://www.google.com/maps";
        name = "Google Maps";
    }

    else if (site === "hazmob") {
        url = "https://www.crazygames.com/game/hazmob-fps";
        name = "Hazmob FPS";
    }

    speak("Đang mở " + name);

    setTimeout(function() {
        window.open(url, "_blank");
    }, 500);
}

function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Trình duyệt này không hỗ trợ nhận diện giọng nói.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "vi-VN";
    recognition.start();

    status.innerHTML = "🎤 Đang nghe...";

    recognition.onresult = function(event) {

        const command =
            event.results[0][0].transcript.toLowerCase();

        status.innerHTML =
            "👤 Bạn nói: " + command;

        if (command.includes("messenger")) {
            openWebsite("messenger");
        }

        else if (command.includes("facebook")) {
            openWebsite("facebook");
        }

        else if (
            command.includes("tik tok") ||
            command.includes("tiktok")
        ) {
            openWebsite("tiktok");
        }

        else if (
            command.includes("google maps") ||
            command.includes("bản đồ")
        ) {
            openWebsite("maps");
        }

        else if (
            command.includes("hazmob") ||
            command.includes("fps")
        ) {
            openWebsite("hazmob");
        }

        else {
            speak("Tôi chưa nhận ra trang bạn muốn mở.");
        }
    };

    recognition.onerror = function() {
        speak("Có lỗi với microphone.");
    };
}

speak("Trợ lý giọng nói đã sẵn sàng.");

</script>

</body>
</html>

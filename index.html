<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trợ lý Robot AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;

    background:
        linear-gradient(rgba(5, 10, 25, 0.85), rgba(10, 5, 30, 0.9)),
        url("https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1920&q=80");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Lớp nền ánh sáng */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 50px,
            rgba(0, 255, 255, 0.04) 51px,
            transparent 52px
        );

    z-index: -1;
}

.app {
    width: min(1100px, 94%);
    margin: 30px auto;
    padding: 30px;

    background: rgba(10, 15, 35, 0.72);
    backdrop-filter: blur(15px);

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 30px;

    box-shadow:
        0 0 40px rgba(0, 200, 255, 0.15);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 38px;
}

.subtitle {
    text-align: center;
    opacity: 0.8;
}

/* ROBOT */

.robot-area {
    height: 420px;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1000px;
}

.robot {
    width: 180px;
    height: 300px;
    position: relative;

    transform-style: preserve-3d;
    animation: robotFloat 3s ease-in-out infinite;
}

/* Đầu */
.head {
    width: 150px;
    height: 110px;

    position: absolute;
    left: 15px;

    border-radius: 35px;

    background:
        linear-gradient(
            135deg,
            #dcefff,
            #506070
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.4),
        0 0 30px rgba(0,255,255,0.5);

    transform:
        rotateY(-8deg)
        rotateX(5deg);
}

/* Mặt */
.face {
    width: 120px;
    height: 45px;

    position: absolute;
    top: 35px;
    left: 15px;

    border-radius: 20px;

    background: #07101a;

    box-shadow:
        inset 0 0 15px #00eaff;
}

/* Mắt */
.eye {
    position: absolute;
    top: 14px;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: #00ffff;

    box-shadow:
        0 0 15px #00ffff;
}

.eye.left {
    left: 25px;
}

.eye.right {
    right: 25px;
}

/* Cổ */
.neck {
    position: absolute;

    top: 110px;
    left: 65px;

    width: 50px;
    height: 25px;

    background: #777;
}

/* Thân */
.body-robot {
    position: absolute;

    top: 135px;
    left: 30px;

    width: 120px;
    height: 120px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #cfdce8,
            #344250
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.4),
        0 0 20px rgba(0,255,255,0.25);
}

/* Lõi AI */
.core {
    position: absolute;

    width: 45px;
    height: 45px;

    left: 37px;
    top: 35px;

    border-radius: 50%;

    background: #00eaff;

    box-shadow:
        0 0 25px #00eaff;

    animation: coreGlow 1.5s infinite alternate;
}

/* Tay */
.arm {
    position: absolute;

    top: 145px;

    width: 30px;
    height: 110px;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #bfcbd5,
            #405060
        );
}

.arm.left {
    left: -5px;
    transform: rotate(8deg);
}

.arm.right {
    right: -5px;
    transform: rotate(-8deg);
}

/* Chân */
.leg {
    position: absolute;

    top: 250px;

    width: 40px;
    height: 80px;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            #c4d0db,
            #35424d
        );
}

.leg.left {
    left: 45px;
}

.leg.right {
    right: 45px;
}

@keyframes robotFloat {
    0%, 100% {
        transform: translateY(0) rotateY(-5deg);
    }

    50% {
        transform: translateY(-15px) rotateY(5deg);
    }
}

@keyframes coreGlow {
    from {
        box-shadow: 0 0 10px #00eaff;
    }

    to {
        box-shadow: 0 0 40px #00eaff;
    }
}

/* TRẠNG THÁI */

#status {
    max-width: 700px;

    margin: 10px auto 25px;

    padding: 18px;

    text-align: center;

    font-size: 20px;

    background: rgba(0, 0, 0, 0.45);

    border: 1px solid rgba(0,255,255,0.25);

    border-radius: 15px;
}

/* MICROPHONE */

.mic-container {
    text-align: center;
}

.mic {
    width: 100px;
    height: 100px;

    border: none;
    border-radius: 50%;

    font-size: 40px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    box-shadow:
        0 0 25px rgba(0,200,255,0.7);

    transition: 0.3s;
}

.mic:hover {
    transform: scale(1.1);
}

.grid {
    margin-top: 35px;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));

    gap: 15px;
}

.app-button {
    padding: 18px;

    border: none;

    border-radius: 15px;

    cursor: pointer;

    color: white;

    font-size: 16px;

    background: rgba(255,255,255,0.1);

    border: 1px solid rgba(255,255,255,0.15);

    transition: 0.25s;
}

.app-button:hover {
    transform: translateY(-5px);

    background: rgba(0, 200, 255, 0.25);

    box-shadow:
        0 10px 25px rgba(0, 200, 255, 0.2);
}

.footer {
    text-align: center;

    margin-top: 25px;

    opacity: 0.6;
}

</style>
</head>

<body>

<div class="app">

<h1>🤖 TRỢ LÝ ROBOT AI</h1>

<p class="subtitle">
Nói tiếng Việt để yêu cầu robot mở ứng dụng
</p>

<div class="robot-area">

<div class="robot">

<div class="head">

<div class="face">
<div class="eye left"></div>
<div class="eye right"></div>
</div>

</div>

<div class="neck"></div>

<div class="body-robot">
<div class="core"></div>
</div>

<div class="arm left"></div>
<div class="arm right"></div>

<div class="leg left"></div>
<div class="leg right"></div>

</div>

</div>

<div id="status">
🤖 Robot đã sẵn sàng
</div>

<div class="mic-container">
<button class="mic" onclick="listen()">🎤</button>
</div>

<div class="grid">

<button class="app-button" onclick="openWebsite('messenger')">
💬 Messenger
</button>

<button class="app-button" onclick="openWebsite('facebook')">
📘 Facebook
</button>

<button class="app-button" onclick="openWebsite('tiktok')">
🎵 TikTok
</button>

<button class="app-button" onclick="openWebsite('maps')">
🗺️ Google Maps
</button>

<button class="app-button" onclick="openWebsite('hazmob')">
🎮 Hazmob FPS
</button>

<button class="app-button" onclick="openWebsite('piano')">
🎹 Virtual Piano
</button>

<button class="app-button" onclick="openWebsite('chatgpt')">
🤖 ChatGPT
</button>

<button class="app-button" onclick="openWebsite('gemini')">
✨ Gemini AI
</button>

<button class="app-button" onclick="openWebsite('suongmai')">
📚 Cô Sương Mai
</button>

<button class="app-button" onclick="openWebsite('maiphuong')">
🇬🇧 Cô Mai Phương
</button>

</div>

<p class="footer">
Robot AI • Trợ lý giọng nói tiếng Việt 🇻🇳
</p>

</div>

<script>

const status = document.getElementById("status");

function speak(text) {

    status.innerHTML = "🤖 " + text;

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "vi-VN";
    speech.rate = 1;
    speech.pitch = 1;

    const voices =
        window.speechSynthesis.getVoices();

    const vietnameseVoice =
        voices.find(voice =>
            voice.lang.toLowerCase()
            .startsWith("vi")
        );

    if (vietnameseVoice) {
        speech.voice =
            vietnameseVoice;
    }

    window.speechSynthesis.speak(speech);
}

function openWebsite(site) {

    const websites = {

        messenger: [
            "https://www.messenger.com/",
            "Messenger"
        ],

        facebook: [
            "https://www.facebook.com/",
            "Facebook"
        ],

        tiktok: [
            "https://www.tiktok.com/",
            "TikTok"
        ],

        maps: [
            "https://www.google.com/maps",
            "Google Maps"
        ],

        hazmob: [
            "https://www.crazygames.com/game/hazmob-fps",
            "Hazmob FPS"
        ],

        piano: [
            "https://virtualpiano.net/",
            "Virtual Piano"
        ],

        chatgpt: [
            "https://chatgpt.com/",
            "ChatGPT"
        ],

        gemini: [
            "https://gemini.google.com/",
            "Gemini AI"
        ],

        suongmai: [
            "https://www.youtube.com/@suongmaiqanda",
            "kênh cô Sương Mai"
        ],

        maiphuong: [
            "https://www.youtube.com/covumaiphuong",
            "kênh cô Mai Phương"
        ,thangdien: [
    "https://www.tiktok.com/@anhquoctran1504/video/7652955039539006741?q=piano%20%20th%C4%83%CC%80ng%20%C4%91i%C3%AAn&t=1788595174990",
    "video piano Thằng Điên"
],

suthanhhoa: [
    "https://www.tiktok.com/@ngdinhtruc/video/7562185929352350983?q=piano%20s%C6%B0%CC%81%20thanh%20hoa&t=1788595217285",
    "video piano Sứ Thanh Hoa"
]
    };

    const [url, name] = websites[site];

    speak("Đang mở " + name);

    setTimeout(function() {

        window.open(
            url,
            "_blank"
        );

    }, 700);
}

function listen() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        speak(
            "Trình duyệt không hỗ trợ nhận diện giọng nói"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "vi-VN";

    recognition.start();

    status.innerHTML =
        "🎤 Robot đang nghe bạn nói...";

    recognition.onresult =
        function(event) {

        const command =
            event.results[0][0]
            .transcript
            .toLowerCase();

        status.innerHTML =
            "👤 Bạn nói: " + command;

        if (command.includes("messenger")) {
            openWebsite("messenger");
        }

        else if (command.includes("facebook")) {
            openWebsite("facebook");
        }

        else if (
            command.includes("tik tok") ||
            command.includes("tiktok")
        ) {
            openWebsite("tiktok");
        }

        else if (
            command.includes("google maps") ||
            command.includes("bản đồ")
        ) {
            openWebsite("maps");
        }

        else if (
            command.includes("hazmob") ||
            command.includes("fps")
        ) {
            openWebsite("hazmob");
        }

        else if (
            command.includes("piano") ||
            command.includes("đàn")
        ) {
            openWebsite("piano");
        }

        else if (
            command.includes("chat gpt") ||
            command.includes("chatgpt")
        ) {
            openWebsite("chatgpt");
        }

        else if (
            command.includes("gemini")
        ) {
            openWebsite("gemini");
        }

        else if (
            command.includes("sương mai")
        ) {
            openWebsite("suongmai");
        }

        else if (
            command.includes("mai phương")
        ) {
            openWebsite("maiphuong");
        }

        else {

            speak(
                "Tôi chưa hiểu. Bạn hãy nói tên ứng dụng cần mở."
            );
        }
    };

    recognition.onerror =
        function() {

        speak(
            "Có lỗi với microphone."
        );
    };
}

speak(
    "Xin chào. Robot AI tiếng Việt đã sẵn sàng."
);

</script>

</body>
</html>
